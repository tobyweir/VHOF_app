<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>VHOF</title>

    <link href="style/main.css" rel="stylesheet" type="text/css">
  </head>
  <body>

    <h1>Fold</h1>
    <button type="button" class="rotateButton">Rotate Fold Direction</button>

    <select class="hofSelector" autocomplete="off">
        <option value="fold" selected>Fold</option>
        <option value="map">Map</option>
        <option value="filter">Filter</option>
    </select>

    <select class="functionSelector" autocomplete="off">
        <option value="add" selected>Addition</option>
        <option value="sub">Subtraction</option>
        <option value="mult">Multiplication</option>
        <option value="div">Division</option>
    </select>

    <select class="animationSpeedSelector" autocomplete="off">
        <option value="fast">Fast</option>
        <option value="standard" selected>Standard</option>
        <option value="slow">Slow</option>
    </select>

    <button type="button" class="clearAllButton">Clear All Tiles</button>

    <div class="grid">
        <div class="row" rowY="0">
          <div class="cell" cellX="0"></div>
          <div class="cell" cellX="1"></div>
          <div class="cell" cellX="2"></div>
          <div class="cell" cellX="3"></div>
          <div class="cell" cellX="4"></div>
        </div>
        <div class="row" rowY="1">
          <div class="cell" cellX="0"></div>
          <div class="cell" cellX="1"></div>
          <div class="cell" cellX="2"></div>
          <div class="cell" cellX="3"></div>
          <div class="cell" cellX="4"></div>
        </div>
        <div class="row" rowY="2">
          <div class="cell" cellX="0"></div>
          <div class="cell" cellX="1"></div>
          
          <div class="cell" cellX="2"></div>
          <div class="cell" cellX="3"></div>
          <div class="cell" cellX="4"></div>
        </div>
        <div class="row" rowY="3">
          <div class="cell" cellX="0"></div>
          <div class="cell" cellX="1"></div>
          <div class="cell" cellX="2"></div>
          <div class="cell" cellX="3"></div>
          <div class="cell" cellX="4"></div>
        </div>
        <div class="row" rowY="4">
          <div class="cell" cellX="0"></div>
          <div class="cell" cellX="1"></div>
          <div class="cell" cellX="2"></div>
          <div class="cell" cellX="3"></div>
          <div class="cell" cellX="4"></div>
        </div>
      <div class="tile-container"></div>
      </div>

    <script src="js/util.js"></script>
    <script src="js/tile.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/grid.js"></script>
  </body>
</html>
